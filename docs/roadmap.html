# 実装計画

> 最終更新: 2026-09-17

どこまで出来ていて、次に何をどの順でやるか。Phase 番号は `architecture.html` のものをそのまま使うが、**着手順は番号順ではない**。

## 現在地

| Phase | 内容 | 状態 |
|-------|------|------|
| 0 | 骨組みと時計（`ClockView` / `DayPalette` / `SkyView`） | 完了 |
| 2 | Gemini Live 会話・料金計上・設定画面 | 完了 |
| 3 | 道具のうち 時刻 (`GetCurrentTimeTool`) と 天気 (`GetWeatherTool`) | 完了 |
| 4 | ページャと 3 ページ（時計・天気・雨レーダー） | 完了 |
| 3 | 残り: Home Assistant の MCP クライアント | コードは完了（手順 2〜6）。**実機と実サーバでの確認（手順 1・7）が残り** |
| 4 | 残り: スマートホームページ・音楽ページ | スマートホームページは実機で確認済み（手順 8）。音楽ページは未着手 |
| 1 | ウェイクワード常時待受と Foreground Service への移行 | 未着手 |
| 5 | Immich フォトフレーム | 未着手 |

## 着手順とその理由

**MCP → 残りのページ → ウェイクワード → Immich** の順で進める。

- **MCP が先。** この端末に一番欲しい「機器と音楽を声で動かす」に直接届くのはここだけで、しかも他のどれにも依存しない
- **ページはその次。** スマートホームページと音楽ページは、MCP が返す機器の状態が無いと中に出すものが無い。MCP より前には書けない
- **ウェイクワードは後ろ。** 一番大きな構造変更（会話を Foreground Service へ移す）だが、得られるのは「タップの代わりに声で始まる」だけ。後回しにしてもコストは増えない。`Conversation.Ui` の境界が残る限り、道具や画面が増えても移行の手間は変わらないため
- **Immich が最後。** 無くても壁掛けとして成立している

## Phase 3 の残り（手順 1〜7）

Home Assistant の MCP サーバ（`/api/mcp`、Streamable HTTP、Bearer トークン）に `tools/list` で聞いた道具をそのまま Gemini に渡し、呼ばれたら `tools/call` に流す。設計と、自前で書かない理由は `architecture.html` の「tools/ の規約」にある。

JSON-RPC は OkHttp への POST 2 種類で足りる。テストを書くのは**レスポンスの解釈だけ**（`tools/list` の JSON → 宣言、`tools/call` の結果 → モデルに返す JSON）。通信そのものは叩いて確かめる — `test-architecture.html` の方針どおり。

実機で分かったことが 2 つある。

- **HA は `Mcp-Session-Id` を返さない。** セッション id 無しで `tools/list` も `tools/call` も通る。仕様上は id を配るサーバもあるので、受け取ったら以降に付ける形は残しつつ、**握手が済んだかどうかで判定する**（id の有無で判定すると HA では一本も取れない）
- **`anyOf` の説明文は分岐側ではなく外側に付いている。** `GetLiveContext` の `domain` がこれで、分岐を選ぶときに外側の `description` を引き継がないと、モデルには用途不明の引数だけが渡る

エンドポイントは既定の `/api/mcp` で当たっていた（`/mcp_server/mcp` は 404、`/mcp_server/sse` は 405）。設定には `http://192.168.1.102:8123` だけを入れてあり、`mcpEndpoint()` が末尾を足している。

手順 5 のキャッシュが要るのは、`Conversation.start()` がメインスレッドで、その場で `tools/list` を待てないため。バックグラウンドで取って保存し、次の会話から反映する。初回だけ家の道具が無い状態で始まる。

## Phase 4 の残り（手順 8〜9）

どちらも MCP が返した機器の状態を描くだけのページ。スマートホームページは `GetLiveContext` の一覧をタイルにし、タップで `HassTurnOn` / `HassTurnOff` を呼ぶ — 声が通るのと同じ道具、同じ入り口。道具名は HA が決めるので末尾一致で引く（`intent__` などの接頭辞は触らない）。入切できる domain（`light` / `switch` / `fan` / `input_boolean` / `cover`）だけをタイルにして、センサーは読み上げに任せる。

実機で分かったことが 2 つある。

- **`GetLiveContext` は機器がこたえるまで前の状態を返す。** ここの照明で実測 19 秒。タップ直後に読み直すと「押す前の状態」が返ってタイルが勝手に戻るので、**押した状態を 30 秒のあいだ家の答えより優先する**（`House.asked`）。家が名前を照合できなかったときだけ即座に戻す。根治は websocket API の `state_changed` を購読することだが、それは 2 本目のクライアントになる
- **名前だけで指すと同名の entity で撥ねられる。** 「寝室のエアコン」が `DUPLICATE_NAME` で失敗した。タイルは一覧から来ているので `name` に加えて `area` と `domain` も送る
- **エアコンは 1 台が 2 つの entity で来る。** 運転モードと設定温度を持つ `climate` と、同じ名前で状態が `unknown` の赤外線 `switch`。同名は `climate` を採る（`tiles()`）。上の `DUPLICATE_NAME` もこれが原因だった
- **モードを変える道具が無い。** HA の MCP が寄越すのは `HassClimateSetTemperature` だけで、`set_hvac_mode` に当たるものは無い。**冷房・暖房・送風は画面では表示だけ、切り替えは声に任せる**。画面から変えたくなったら websocket か REST を足すことになる（= 2 本目のクライアント）`tools/` は UI を知らないという規約は変えない — 道具が呼ばれたことを `Conversation` が見て、ページの更新を UI に伝える。ただし MCP の道具名は HA が決めるので、butler のように「この道具が呼ばれたらこの画面」と名前で分岐するのは脆い。**家の道具が呼ばれたら家のページを更新する**、くらいの粗さで始める。

## Phase 1（手順 10〜11）

会話と検出を Foreground Service に移し、Activity は表示だけにする。ウェイクワードは butler の Julius の成果物（音響モデルと辞書）を流用する。

ここだけ `androidTest` を入れる。録音した音声を流し込んで検出率を測る必要があるため（`test-architecture.html` に明記済み）。それ以外でテストの種類は増やさない。

## Phase 5（手順 12）

Immich の API から写真を取って一定間隔で切り替える。1 ページ増やすだけで、他とは繋がらない。

## 気をつける点

- **Spotify の `media_player` が `search_media` に対応していないと、選曲だけ落ちる。** 機器操作は無傷。手順 1 で分かるので、そこで分かったら音楽の選曲は別の道を考える
- **`tools/list` が大きいと、毎セッションの setup でトークンを食う。** 実測で道具は 21 本。道具 2 本のときの `promptTokenCount` は初回 893 だったので、23 本にした後の初回と比べる（未計測）
- **HA 側で「Assist に公開」していない entity は見えない。** 道具が空で返ったらまずここを疑う
- **MCP が期待どおり動かなかった場合の退路**は、butler から HA クライアントを移植すること（ファジーマッチ・部屋名の Jinja テンプレート・service のホワイトリストで 400 行以上）。そのときはこの計画の手順 3〜7 を差し替える

## やらないと決めたもの

- **複数の MCP サーバ・OAuth・stdio・呼び出しごとの承認ダイアログ。** 2 台目を繋ぎたくなってから考える
- **喋りかぶせ（barge-in）。** ソフトウェア AEC が要る。画面タップで返答を捨てる今の形で足りている
- **Google フォト。** 理由は `architecture.html` の末尾
- **CI。** 端末 1 台の個人プロジェクトでは、実機で動かすほうが速い
